[workspace]
resolver = "2"
# Optional hardware PC/SC adapter is built explicitly; keep the default
# workspace pure-Rust.
exclude = ["usim-pcsc"]
members = [
    "sip",
    "aka",
    "ims",
    "carrier",
    "codec",
    "codec-amr",
    "epdg",
    "gba",
    "evs",
    "media",
    "transport",
    "usim",
    "cli",
    "tests/conformance",
    "lab/emergency",
    "lab/epdg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
# Cryptographic primitives come from RustCrypto. The protocol logic (Milenage,
# EAP-AKA', IKEv2, ESP framing) is ours; the primitives are not.
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
subtle = "2.6"
sip = { path = "sip" }
aka = { path = "aka" }
ims = { path = "ims" }
carrier = { path = "carrier" }
gba = { path = "gba" }
codec = { path = "codec" }
codec-amr = { path = "codec-amr" }
epdg = { path = "epdg" }
evs = { path = "evs" }
media = { path = "media" }
transport = { path = "transport" }
usim = { path = "usim" }
