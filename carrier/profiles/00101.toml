# Carrier profile: Open5GS/Kamailio IMS lab PLMN 001/01.
# Values are configuration, not vendor code. APN/UA/feature-tag shapes are
# public facts from 3GPP TS 23.003 / GSMA IR.92 / IR.94.
id = "00101"
mcc = "001"
mnc = "01"
operator = "Open5GS IMS lab"
display_name = "Lab (MCC 001 / MNC 01)"

# TS 23.003 §9.1: APN used for the IMS PDN.
ims_apn = "ims"
# P-CSCF discovery: "static" (lab), "pco" (modem provides), or "dhcp".
p_cscf_discovery = "static"
p_cscf = ["pcscf.ims.mnc001.mcc001.3gppnetwork.org"]
# Optional explicit IP:port if DNS is not available in the lab.
p_cscf_ports = [5060]

volte = true
# The lab has no encumbered codecs: AMR-WB is negotiated in SDP fixtures only.
evs = false
amr_wb_modes = [0, 1, 2, 3, 4, 5, 6, 7]
sms_over_ims = true

# TS 24.229 §5.1.1 / GSMA IR.92 §4.1: UA and feature tags.
ua = "fungos-ims/0.1 (Linux; +https://example.invalid/fungos-ims)"
feature_tags = [
  "g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"",
  "g.3gpp.smsip",
]

[timers]
t1_ms = 500
t2_ms = 4000
register_expires_s = 600000
subscribe_expires_s = 600000
invite_expires_s = 180
prack_wait_ms = 4000
